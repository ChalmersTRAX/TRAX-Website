{{ $questions := .Site.Data.questions.data.questions }}

<div class="faq-container">
    {{ range $q := sort $questions "weight" }}
    <details class="faq-item">
        <summary class="faq-question">{{ $q.question }}</summary>
        <div class="faq-answer">
            {{ $q.answer | safeHTML }}
        </div>
    </details>
    {{ end }}
</div>
